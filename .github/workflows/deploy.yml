name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript syntax check
        run: node --check app.js

      - name: Reject secret keys in the repo
        run: |
          if grep -rEn --exclude-dir=.git --exclude-dir=.github "sb_secret_[A-Za-z0-9_-]{10,}|eyJ[A-Za-z0-9_-]{20,}\." .; then
            echo "Secret key or JWT found. Only the publishable key may be committed."
            exit 1
          fi

      - name: Check Supabase config is filled in
        run: |
          if grep -q "YOUR-PROJECT\|YOUR-ANON-KEY" app.js; then
            echo "app.js still has placeholder Supabase values."
            exit 1
          fi

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Publish only the frontend; supabase/ and docs stay out of the site.
      - name: Build site
        run: |
          mkdir _site
          cp index.html style.css app.js _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
