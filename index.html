<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ADOHRE | Digital Voting Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">A</div>
      <div>ADOHRE<small>DIGITAL VOTING PORTAL</small></div>
    </div>
    <div class="topright">Association of DOH Retired Employees</div>
  </header>

  <div class="shell">
    <aside class="sidebar">
      <div class="side-brand">
        <div class="logo">A</div>
        <div>
          <h2>ADOHRE</h2>
          <div class="side-user" id="session-email" hidden></div>
          <p>Association of DOH Retired Employees</p>
        </div>
      </div>
      <nav class="navitems">
        <button class="navbtn active" data-nav="portal" id="nav-portal">&#8962; &nbsp; Voting Portal</button>
        <button class="navbtn" data-nav="guide" id="nav-guide">&#9636; &nbsp; Voting Guide</button>
        <button class="navbtn" data-nav="admin" id="nav-admin" hidden>&#9881; &nbsp; Manage Polls</button>
        <button class="navbtn" data-nav="attendance" id="nav-attendance" hidden>&#9745; &nbsp; Attendance</button>
        <button class="navbtn" id="signout" hidden>&#8617; &nbsp; Sign out</button>
      </nav>
      <div class="sidefoot">
        Honoring service.<br>Strengthening our community.
      </div>
    </aside>

    <main class="main">
      <section class="welcome">
        <div class="eyebrow">Member voting experience</div>
        <h1 id="welcome-title">Your voice. Your association.</h1>
        <p id="welcome-text"></p>
      </section>
      <div class="content" id="app"></div>
      <div class="footer">ADOHRE DIGITAL VOTING PORTAL</div>
    </main>
  </div>
  <div id="toastroot"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"
    integrity="sha384-mZT2gIty7ZDdOGkxfP6joZcYdMW1Jvj9dRlfpTmaJAKKXTqzygtB22k7FLe+KZC1" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"
    integrity="sha384-b5Ya4Bq3qCyz39m2ISh+4DxjAIljdeFwK/BsXLuj9gugaNwAcj/ia15fxNZL9Nlx" crossorigin="anonymous"></script>
  <script src="app.js"></script>
</body>
</html>
